<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for the env(safe-area-inset-*) values
         used in main.css to be non-zero. Without it, fullscreen display mode
         would push content under a notch / camera cutout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- iOS auto-detects phone numbers, dates, addresses and emails and turns
         them into blue tappable links. The results screen's timestamps get
         caught by this — disable it app-wide. -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />

    <title>ECLIPSE</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f3ecd8" />

    <!-- iOS doesn't read manifest.json for install behaviour; these are the
         equivalents Safari actually honours. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ECLIPSE" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/gate.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- iOS/WebKit ignores the manifest's "orientation" field entirely and
         has no orientation-lock API, so landscape can't actually be enforced
         there. This overlay blocks portrait instead. It only ever appears in
         the installed app: the gate replaces document.body wholesale, so it's
         gone on the gate page (which must work in either orientation). -->
    <div class="rotate-notice">
      <div class="rotate-notice__inner">
        <div class="rotate-notice__icon">⟲</div>
        <p class="rotate-notice__jp">画面を横向きにしてください</p>
        <p class="rotate-notice__en">Please rotate your device to landscape</p>
        <p class="rotate-notice__hint">
          回転しない場合は、画面の向きのロックを解除してください<br />
          If it won't rotate, turn off your device's rotation lock
        </p>
      </div>
    </div>

    <!-- Only the gate loads here. It checks whether the app is running
         installed and, if so, injects content.js / screens.js / navigate.js /
         app.js itself. In a plain browser tab those scripts are never
         fetched, so there is no app in the page to bypass the gate. -->
    <script src="js/gate.js"></script>
  </body>
</html>
